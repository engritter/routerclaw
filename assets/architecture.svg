<g fill="#5be1bb" font-size="15" letter-spacing="2"><text x="70" y="172">01 / ADMISSION</text><text x="345" y="172">02 / CLASSIFY</text><text x="620" y="172">03 / SELECT</text><text x="895" y="172">04 / CHECK</text><text x="1170" y="172">05 / VERIFY</text></g>
<g fill="#e6eff8" font-size="21" font-weight="700"><text x="70" y="212">Native input</text><text x="345" y="212">Kind + risk</text><text x="620" y="212">Model + effort</text><text x="895" y="212">Prepared route</text><text x="1170" y="212">Runtime + delivery</text></g>
<g fill="#94adc0" font-size="16"><text x="70" y="247">Recorder · identity</text><text x="70" y="269">Abort · authority</text><text x="345" y="247">Validated JSON</text><text x="345" y="269">Confidence · attachments</text><text x="620" y="247">Per-turn copy</text><text x="620" y="269">Human overrides preserved</text><text x="895" y="247">OAuth · harness · scope</text><text x="895" y="269">Refuse incompatible plans</text><text x="1170" y="247">Selected ≠ fallback</text><text x="1170" y="269">Accepted ≠ delivered</text></g>
<rect x="48" y="326" width="1345" height="87" rx="12" fill="#102e32"/><text x="70" y="360" fill="#a5decf" font-size="19">Same conversation. Native authority stays in charge.</text><text x="70" y="391" fill="#8faeb7" font-size="16">Experimental exact-scope reference. Native command and callback coverage remains incomplete.</text>
