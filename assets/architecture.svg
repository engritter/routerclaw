<g font-family="Arial,sans-serif"><text x="48" y="52" fill="#d8edff" font-size="26" font-weight="700">A route belongs to the admitted message</text><text x="48" y="86" fill="#8ba7bd" font-size="18">No shared-session preference patch → send → restore loop</text>
<g fill="#112b3d" stroke="#345369"><rect x="48" y="142" width="225" height="142" rx="14"/><rect x="323" y="142" width="225" height="142" rx="14"/><rect x="598" y="142" width="225" height="142" rx="14"/><rect x="873" y="142" width="225" height="142" rx="14"/><rect x="1148" y="142" width="245" height="142" rx="14"/></g>
