name: Initialize reviewed RouterClaw source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish-reviewed-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore reviewed source snapshot (no credentials or private history)
        env:
          SOURCE_00: ''
          SOURCE_01: ''
          SOURCE_02: ''
          SOURCE_03: ''
          SOURCE_04: ''
          SOURCE_05: ''
          SOURCE_06: ''
          SOURCE_07: ''
          SOURCE_08: ''
          SOURCE_09: ''
          SOURCE_10: ''
          SOURCE_11: ''
          SOURCE_12: ''
          SOURCE_13: ''
          SOURCE_14: ''
          SOURCE_15: ''
          SOURCE_16: ''
          SOURCE_17: ''
          SOURCE_18: ''
          SOURCE_19: ''
          SOURCE_20: ''
          SOURCE_21: ''
          SOURCE_22: ''
          SOURCE_23: ''
          SOURCE_24: ''
          SOURCE_25: ''
          SOURCE_26: ''
          SOURCE_27: ''
          SOURCE_28: ''
          SOURCE_29: ''
          SOURCE_30: ''
          SOURCE_31: ''
          SOURCE_32: ''
          SOURCE_33: ''
          SOURCE_34: ''
          SOURCE_35: ''
          SOURCE_36: ''
          SOURCE_37: ''
          SOURCE_38: ''
          SOURCE_39: ''
          SOURCE_40: ''
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,os
          data=base64.b64decode(''.join(os.environ['SOURCE_'+str(i).zfill(2)] for i in range(41)))
          assert hashlib.sha256(data).hexdigest()=='875d324a9468c4c0b807ab37fd890a59cde5358403e483159ef9c2a193cc1eb5'
          root=pathlib.Path.cwd().resolve()
          files=json.loads(gzip.decompress(data))
          assert len(files)==66
          for name,text in files.items():
              target=(root/name).resolve()
              assert target.is_relative_to(root) and '.git' not in target.relative_to(root).parts
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(text,encoding='utf-8',newline='')
          print('Verified source snapshot restored:',len(files),'files')
          PY
      - run: python3 scripts/build_reference.py
      - run: node scripts/build-routerclaw.mjs
      - run: node --test test/*.test.mjs
      - run: node scripts/check-public.mjs
      - name: Record verified public source
        run: |
          git config user.name 'Álvaro Ritter'
          git config user.email '325858541+engritter@users.noreply.github.com'
          git add -- . ':!.github/workflows/initialize-reviewed-source.yml'
          git commit -m 'Publish reviewed RouterClaw source, installer and 70 isolated tests'
          git push origin HEAD:main
      - name: Build alpha installer artifact
        working-directory: packages/routerclaw
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: routerclaw-alpha2-installer
          path: packages/routerclaw/engritter-routerclaw-0.1.0-alpha.2.tgz
          if-no-files-found: error
